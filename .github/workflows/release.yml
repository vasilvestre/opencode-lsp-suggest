name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Read local version
        id: local
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Read published version
        id: published
        run: echo "version=$(npm view @vasilvestre/opencode-lsp-suggest version 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: Skip when already published
        if: steps.local.outputs.version == steps.published.outputs.version
        run: |
          echo "Version ${{ steps.local.outputs.version }} is already on npm, nothing to do."
          exit 0
      - run: npm test
      - run: npm run build --if-present
      - run: npm publish --access public
